<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Security Check</title>

  <!-- 카카오톡 / 링크 미리보기용 -->
  <meta property="og:title" content="YOU JUST ACTIVATED MY TRAP CARD" />
  <meta property="og:description" content="트랩 카드 테스트 페이지입니다. 눌러서 이동해보세요." />
  <meta property="og:image" content="https://kim-dohyeon4552.github.io/security-check/images/trap-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://kim-dohyeon4552.github.io/security-check/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Security Check" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#111111" />
</head>


  <main style="
    padding: 90px 20px 40px;
    max-width: 700px;
    margin: 0 auto;
  ">
    <!-- 큰 대표 이미지 -->
    <img 
      src="./images/trap-card.png" 
      alt="Trap Card"
      style="
        width: 100%;
        max-width: 600px;
        display: block;
        margin: 0 auto 20px;
        border-radius: 14px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      "
    />


  </main>

  <script>
    let deferredPrompt;

    const installBtn = document.getElementById("installBtn");
    const topNotice = document.getElementById("topNotice");
    const guideText = document.getElementById("guideText");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" });
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();

      deferredPrompt = event;

      topNotice.innerText = "앱을 설치할 수 있습니다.";
      installBtn.style.display = "inline-block";
      guideText.innerText = "버튼을 누르면 Android 설치 창이 표시됩니다.";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) {
        guideText.innerText = "설치 조건 확인 중입니다. Android Chrome에서 다시 접속해주세요.";
        return;
      }

      topNotice.innerText = "설치 진행 중입니다...";

      deferredPrompt.prompt();

      const result = await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        topNotice.innerText = "설치가 시작되었습니다.";
        guideText.innerText = "홈 화면 또는 앱 목록에서 아이콘을 확인해주세요.";
      } else {
        topNotice.innerText = "설치가 취소되었습니다.";
        guideText.innerText = "필요하면 다시 설치 버튼을 눌러주세요.";
      }

      deferredPrompt = null;
    });

    window.addEventListener("appinstalled", () => {
      topNotice.innerText = "앱 설치가 완료되었습니다.";
      installBtn.style.display = "none";
    });
  </script>
</body>
</html>
