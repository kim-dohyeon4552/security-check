<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Security Check</title>

  <!-- 카카오톡 / 문자 링크 미리보기용 Open Graph 설정 -->
  <meta property="og:title" content="Security Check 앱 설치" />
  <meta property="og:description" content="아래 링크를 눌러 Security Check 앱을 설치해주세요." />
  <meta property="og:image" content="https://kim-dohyeon4552.github.io/security-check/icons/icon-512.png" />
  <meta property="og:url" content="https://kim-dohyeon4552.github.io/security-check/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Security Check" />

  <!-- 브라우저 / PWA 설정 -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#111111" />
</head>

<body>
  <div id="topNotice" style="
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #111;
    color: white;
    padding: 14px;
    text-align: center;
    font-size: 15px;
    z-index: 9999;
  ">
    앱 설치 준비 중입니다...
  </div>

  <main style="
    padding: 90px 20px 20px;
    font-family: Arial, sans-serif;
  ">
    <h1>Security Check</h1>
    <p>아래 버튼을 눌러 앱을 설치해주세요.</p>

    <button id="installBtn" style="
      display: none;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
    ">
      앱 설치하기
    </button>

    <p id="guideText" style="margin-top: 20px; color: #555;">
      Android Chrome에서 접속하면 설치 버튼이 표시됩니다.
    </p>
  </main>

  <script>
    let deferredPrompt;

    const installBtn = document.getElementById("installBtn");
    const topNotice = document.getElementById("topNotice");
    const guideText = document.getElementById("guideText");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" });
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();

      deferredPrompt = event;

      topNotice.innerText = "앱을 설치할 수 있습니다.";
      installBtn.style.display = "inline-block";
      guideText.innerText = "버튼을 누르면 Android 설치 창이 표시됩니다.";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) {
        guideText.innerText = "설치 조건 확인 중입니다. Android Chrome에서 다시 접속해주세요.";
        return;
      }

      topNotice.innerText = "설치 진행 중입니다...";

      deferredPrompt.prompt();

      const result = await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        topNotice.innerText = "설치가 시작되었습니다.";
        guideText.innerText = "홈 화면 또는 앱 목록에서 아이콘을 확인해주세요.";
      } else {
        topNotice.innerText = "설치가 취소되었습니다.";
        guideText.innerText = "필요하면 다시 설치 버튼을 눌러주세요.";
      }

      deferredPrompt = null;
    });

    window.addEventListener("appinstalled", () => {
      topNotice.innerText = "앱 설치가 완료되었습니다.";
      installBtn.style.display = "none";
    });
  </script>
</body>
</html>
